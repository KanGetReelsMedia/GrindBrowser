<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Grind Browser</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192x192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="theme-color" content="#A3E635">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            lime: { DEFAULT: '#a3e635', dark: '#84cc16' },
            black: { bg: '#09090b', panel: '#121215', card: '#18181b', border: '#27272a' }
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');
    *{font-family:'Inter',sans-serif}
    .no-scrollbar::-webkit-scrollbar{display:none}
    iframe.webview{width:100%;height:100%;border:none;background:#09090b}
  </style>
</head>
<body class="bg-[#09090b] text-zinc-100 h-[100dvh] w-screen flex flex-col overflow-hidden">

  <!-- MOBILE HEADER -->
  <header class="h-14 px-3 flex items-center justify-between bg-[#121215] border-b border-[#27272a] shrink-0 z-30">
    <div class="flex items-center gap-2">
      <button id="menu-btn" class="w-9 h-9 rounded-xl bg-[#18181b] border border-[#27272a] flex items-center justify-center text-zinc-400">☰</button>
      <div class="flex items-center gap-1.5">
        <img src="icon-192x192.png" class="w-7 h-7 rounded-lg border border-lime/30">
        <span class="font-black text-[13px] tracking-wider">GRIND<span class="font-light text-lime ml-1">BROWSER</span></span>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <span class="text-[9px] bg-lime/10 text-lime border border-lime/20 px-2 py-1 rounded-full">PWA</span>
      <button id="install-btn" class="hidden bg-lime text-black text-[11px] font-bold px-3 py-1.5 rounded-full">Install</button>
    </div>
  </header>

  <!-- DRAWER + OVERLAY -->
  <div id="overlay" class="hidden fixed inset-0 bg-black/60 z-20"></div>
  <aside id="sidebar" class="fixed left-0 top-14 bottom-0 w-[85%] max-w-[320px] bg-[#121215] border-r border-[#27272a] z-30 -translate-x-full transition-transform duration-300 flex flex-col p-4 gap-4 overflow-y-auto no-scrollbar">
    <div class="bg-[#18181b] border border-[#27272a] rounded-2xl p-4">
      <p class="text-xs font-bold text-lime mb-2">Scratchpad</p>
      <textarea id="notes" class="w-full h-28 bg-[#09090b] border border-[#27272a] rounded-xl p-3 text-xs text-zinc-200 focus:border-lime outline-none resize-none" placeholder="Quick thoughts..."></textarea>
    </div>
    <div class="bg-[#18181b] border border-[#27272a] rounded-2xl p-4">
      <p class="text-xs font-bold text-zinc-300 mb-3">Ad-First Test</p>
      <div class="flex flex-col gap-2">
        <input id="main-video-input" value="Ocxd9eUUl0I" class="bg-[#09090b] border border-[#27272a] rounded-xl px-3 py-2.5 text-xs text-white outline-none focus:border-lime">
        <input id="ad-video-input" value="F8X7TmILPuc" class="bg-[#09090b] border border-[#27272a] rounded-xl px-3 py-2.5 text-xs text-white outline-none focus:border-lime">
        <button id="test-grind-btn" class="mt-1 bg-lime text-black font-black py-3 rounded-xl text-xs tracking-wider">PLAY AD → VIDEO</button>
      </div>
    </div>
    <div class="mt-auto text-[10px] text-zinc-500 leading-relaxed">
      PWA installs like a real app.<br>Grind protocol works offline.
    </div>
  </aside>

  <!-- MAIN -->
  <main class="flex-1 flex flex-col relative overflow-hidden">
    
    <!-- START PAGE - MOBILE CENTERED -->
    <div id="start-page" class="flex-1 flex flex-col items-center justify-center p-5 overflow-y-auto">
      <div class="w-full max-w-[380px] flex flex-col items-center gap-6">
        <img src="icon-192x192.png" class="w-20 h-20 rounded-[22px] border-2 border-lime/30 shadow-[0_0_30px_rgba(163,230,53,0.2)]">
        <div class="text-center">
          <h1 class="text-[28px] font-black tracking-tight">GRIND <span class="font-light text-lime">BROWSER</span></h1>
          <p class="text-[12px] text-zinc-500 mt-1">Tap to browse, no app store needed</p>
        </div>

        <div class="w-full relative">
          <input id="central-search-input" type="text" placeholder="Search or type wwe.com" class="w-full pl-11 pr-4 py-4 bg-[#18181b] border border-[#27272a] focus:border-lime text-white rounded-[18px] text-[14px] outline-none">
          <span class="absolute left-4 top-1/2 -translate-y-1/2 text-lime">⌕</span>
        </div>

        <div class="grid grid-cols-3 gap-2 w-full">
          <button onclick="navigateTo('https://wwe.com')" class="bg-[#18181b] border border-[#27272a] rounded-2xl py-3 flex flex-col items-center gap-1">
            <span class="text-lg">🤼</span><span class="text-[10px] text-zinc-400">WWE</span>
          </button>
          <button onclick="navigateTo('https://youtube.com')" class="bg-[#18181b] border border-[#27272a] rounded-2xl py-3 flex flex-col items-center gap-1">
            <span class="text-lg">▶️</span><span class="text-[10px] text-zinc-400">YouTube</span>
          </button>
          <button onclick="navigateTo('grind://watch?v=Ocxd9eUUl0I')" class="bg-lime/10 border border-lime/20 rounded-2xl py-3 flex flex-col items-center gap-1">
            <span class="text-lg">⚡</span><span class="text-[10px] text-lime">Grind Test</span>
          </button>
        </div>
      </div>
    </div>

    <!-- BROWSER VIEW -->
    <div id="browser-view" class="hidden flex-1 flex flex-col">
      <div class="h-10 bg-[#121215] border-b border-[#27272a] flex items-center px-3 gap-2 text-[11px]">
        <span id="page-status" class="text-lime shrink-0">●</span>
        <span id="page-url" class="text-zinc-500 truncate flex-1"></span>
        <button id="back-to-start" class="bg-[#18181b] border border-[#27272a] px-3 py-1 rounded-full text-zinc-400">Home</button>
      </div>
      <iframe id="main-frame" class="webview flex-1 bg-[#09090b]" src="about:blank" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-presentation"></iframe>
    </div>

    <!-- AD PLAYER - MOBILE FULL -->
    <div id="ad-player-view" class="hidden absolute inset-0 bg-black z-40 flex flex-col">
      <div class="h-14 bg-[#121215] flex items-center px-4 justify-between">
        <span class="text-lime font-black text-xs tracking-wider">GRIND • AD FIRST</span>
        <button id="close-ad-player" class="w-8 h-8 rounded-full bg-[#18181b] border border-[#27272a]">✕</button>
      </div>
      <div class="flex-1 relative bg-black">
        <iframe id="ad-frame" class="webview" src="about:blank" allow="autoplay; fullscreen" allowfullscreen></iframe>
        <div id="ad-overlay" class="absolute top-3 left-3 bg-lime text-black text-[11px] font-black px-3 py-1.5 rounded-full">AD • Skip in <span id="skip-count">5</span>s</div>
        <button id="skip-ad-btn" class="hidden absolute bottom-6 left-1/2 -translate-x-1/2 bg-white text-black px-8 py-3 rounded-full text-sm font-black shadow-2xl">Skip Ad →</button>
      </div>
    </div>
  </main>

  <!-- MOBILE BOTTOM BAR -->
  <footer class="h-[64px] bg-[#121215] border-t-2 border-lime flex items-center px-2 gap-1.5 shrink-0 z-30">
    <button id="btn-back" class="w-11 h-11 rounded-xl bg-[#18181b] border border-[#27272a] text-zinc-400">←</button>
    <button id="btn-refresh" class="w-11 h-11 rounded-xl bg-[#18181b] border border-[#27272a] text-zinc-400">↻</button>
    <div class="flex-1 flex items-center bg-[#09090b] border border-[#27272a] rounded-xl px-3 h-11">
      <span id="protocol-label" class="text-lime font-mono font-bold text-[11px] mr-1.5">grind://</span>
      <input id="address-bar-input" type="text" placeholder="newtab" class="bg-transparent text-[13px] text-white w-full outline-none">
    </div>
    <button id="add-tab-btn" class="w-11 h-11 rounded-xl bg-lime text-black font-black">+</button>
  </footer>

<script>
  let deferredPrompt;
  window.addEventListener('beforeinstallprompt', e=>{
    e.preventDefault(); deferredPrompt=e;
    document.getElementById('install-btn').classList.remove('hidden');
  });
  document.getElementById('install-btn')?.addEventListener('click', async()=>{
    if(deferredPrompt){ deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt=null; }
  });
  if('serviceWorker' in navigator){ navigator.serviceWorker.register('./sw.js').catch(()=>{}); }

  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('overlay');
  function toggleMenu(){
    const closed = sidebar.classList.contains('-translate-x-full');
    if(closed){ sidebar.classList.remove('-translate-x-full'); overlay.classList.remove('hidden'); }
    else { sidebar.classList.add('-translate-x-full'); overlay.classList.add('hidden'); }
  }
  document.getElementById('menu-btn').onclick = toggleMenu;
  overlay.onclick = toggleMenu;

  const mainFrame = document.getElementById('main-frame');
  const adFrame = document.getElementById('ad-frame');
  const startPage = document.getElementById('start-page');
  const browserView = document.getElementById('browser-view');
  const adPlayerView = document.getElementById('ad-player-view');
  const addressInput = document.getElementById('address-bar-input');
  const centralInput = document.getElementById('central-search-input');
  const protocolLabel = document.getElementById('protocol-label');
  const pageUrl = document.getElementById('page-url');

  function showStart(){
    startPage.classList.remove('hidden');
    browserView.classList.add('hidden');
    adPlayerView.classList.add('hidden');
    addressInput.value='newtab';
    protocolLabel.textContent='grind://';
    if(!sidebar.classList.contains('-translate-x-full')) toggleMenu();
  }
  function normalize(i){
    i=i.trim();
    if(i.startsWith('grind://')) return i;
    if(i.startsWith('https://')||i.startsWith('http://')) return i;
    if(i.includes('.')&&!i.includes(' ')) return 'https://'+i;
    return 'https://duckduckgo.com/?q='+encodeURIComponent(i);
  }
  window.navigateTo = function(url){
    url=normalize(url);
    if(url.startsWith('grind://')){
      if(url.includes('watch?v=')){
        const m=url.match(/v=([^&]+)/);
        playGrindFlow(m?m[1]:document.getElementById('main-video-input').value);
        return;
      }
      showStart(); return;
    }
    startPage.classList.add('hidden');
    adPlayerView.classList.add('hidden');
    browserView.classList.remove('hidden');
    mainFrame.src=url;
    addressInput.value=url.replace('https://','');
    protocolLabel.textContent='https://';
    pageUrl.textContent=url;
  }
  function playGrindFlow(mainVideoId){
    const adId=document.getElementById('ad-video-input').value||'F8X7TmILPuc';
    const mainId=mainVideoId||document.getElementById('main-video-input').value||'Ocxd9eUUl0I';
    startPage.classList.add('hidden');
    browserView.classList.add('hidden');
    adPlayerView.classList.remove('hidden');
    adFrame.src=`https://www.youtube.com/embed/${adId}?autoplay=1`;
    addressInput.value=`ad/${adId} → video/${mainId}`;
    let count=5;
    const skipCount=document.getElementById('skip-count');
    const skipBtn=document.getElementById('skip-ad-btn');
    skipBtn.classList.add('hidden');
    document.getElementById('ad-overlay').classList.remove('hidden');
    const interval=setInterval(()=>{
      count--; skipCount.textContent=count;
      if(count<=0){
        clearInterval(interval);
        skipBtn.classList.remove('hidden');
        document.getElementById('ad-overlay').textContent='Grind Network';
      }
    },1000);
    skipBtn.onclick=()=>{
      clearInterval(interval);
      adFrame.src=`https://www.youtube.com/embed/${mainId}?autoplay=1`;
      document.getElementById('ad-overlay').textContent='NOW PLAYING';
      skipBtn.classList.add('hidden');
    };
  }
  centralInput.addEventListener('keypress', e=>{ if(e.key==='Enter') navigateTo(centralInput.value)});
  addressInput.addEventListener('keypress', e=>{ if(e.key==='Enter') navigateTo(addressInput.value)});
  document.getElementById('back-to-start').onclick=showStart;
  document.getElementById('close-ad-player').onclick=showStart;
  document.getElementById('test-grind-btn').onclick=()=>{ if(!sidebar.classList.contains('-translate-x-full')) toggleMenu(); playGrindFlow(); };
  document.getElementById('btn-back').onclick=()=>{ try{ mainFrame.contentWindow.history.back(); }catch{} };
  document.getElementById('btn-refresh').onclick=()=>{ mainFrame.src=mainFrame.src; };
  document.getElementById('add-tab-btn').onclick=showStart;
  showStart();
</script>
</body>
</html>
